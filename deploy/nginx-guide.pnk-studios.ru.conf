# /etc/nginx/sites-available/guide.pnk-studios.ru
# ln -s /etc/nginx/sites-available/guide.pnk-studios.ru /etc/nginx/sites-enabled/
# nginx -t && systemctl reload nginx
# certbot --nginx -d guide.pnk-studios.ru

upstream guideshin {
    server 127.0.0.1:3000;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name guide.pnk-studios.ru;

    client_max_body_size 80m;

    # Uploads с диска — не через Next (видны сразу после загрузки)
    location /uploads/ {
        alias /var/www/guideshin/public/uploads/;
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location /_next/static/ {
        proxy_pass http://guideshin;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        expires 365d;
        add_header Cache-Control "public, immutable";
    }

    location / {
        proxy_pass http://guideshin;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 120s;
    }
}
